<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joystick — Super Casual UI Kit</title>
<link rel="stylesheet" href="../core.css">
<link rel="stylesheet" href="../components/joystick/joystick.css">
<link rel="stylesheet" href="../components/actions/actions.css">
<link rel="stylesheet" href="../components/button/button.css">
<link rel="stylesheet" href="docs.css">
<script src="../sc.js"></script>
<script src="docs.js"></script>
<style>
.row { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center; gap:30px; }
.log { margin:10px 0 0; color:#dce6ff; font:14px/1.5 system-ui; text-align:center; font-variant-numeric:tabular-nums; }
.zone { position:relative; width:100%; max-width:340px; height:220px; border-radius:16px; border:2px dashed rgba(255,255,255,.25); background:rgba(255,255,255,.05); }
.zone p { position:absolute; inset:auto 0 8px; text-align:center; margin:0; color:rgba(255,255,255,.55); font:13px system-ui; }
</style>
</head>
<body>
<script>
SCDocs.page({
  title: 'Joystick',
  lead: 'On-screen movement control for mobile games: a thumbstick or a D-pad. Works with touch, mouse and WASD / arrow keys.',
  hero: `<div class="row">
  <div class="sc-joystick" data-color="sky"></div>
  <div class="sc-joystick" data-variant="dpad" data-color="purple"></div>
</div>`,
  css: ['components/joystick/joystick.css'],
  usageNote: 'Put it in the bottom area of a Screen Shell, usually on the left, with Action Buttons on the right. Listen for "move" and "end".',
  usage: `<div class="sc-joystick" id="stick" data-color="sky"></div>

<script>
  stick.addEventListener('move', e => player.setVelocity(e.detail.x, e.detail.y));  // x,y are -1…1
  stick.addEventListener('end', () => player.stop());
<\/script>`,
  examples: [
    { title: 'Stick, D-pad and sizes', desc: 'data-variant="dpad" for a classic 4-way pad. Sizes sm / md / lg (120 / 150 / 180 px).',
      html: `<div class="row">
  <div class="sc-joystick" data-size="sm" data-color="green"></div>
  <div class="sc-joystick" data-color="sky"></div>
  <div class="sc-joystick" data-variant="dpad" data-size="lg" data-color="yellow"></div>
</div>` },
    { title: 'Directions: free, 8-way or 4-way', desc: 'data-snap decides what the game receives. Free = any angle; 8 = eight directions; 4 = up/down/left/right only.',
      html: `<div class="row">
  <div class="sc-joystick" id="jFree" data-color="sky"></div>
  <div class="sc-joystick" id="j8" data-snap="8" data-color="purple"></div>
  <div class="sc-joystick" id="j4" data-variant="dpad" data-snap="4" data-color="red"></div>
</div>
<p class="log" id="snapLog">drag one — free / 8 / 4</p>`,
      setup(p) {
        const log = p.querySelector('#snapLog');
        ['jFree', 'j8', 'j4'].forEach((id, i) => {
          const el = p.querySelector('#' + id), name = ['free', '8-way', '4-way'][i];
          el.addEventListener('move', e => log.textContent = `${name}: ${e.detail.dir}  ·  x ${e.detail.x}  y ${e.detail.y}  ·  power ${e.detail.distance}`);
          el.addEventListener('end', () => log.textContent = `${name}: released`);
        });
      } },
    { title: 'Follow the thumb', desc: 'data-mode="follow" inside a .sc-joystick-zone: the stick appears wherever the player touches that area and disappears on release.',
      html: `<div class="zone sc-joystick-zone">
  <div class="sc-joystick" data-mode="follow" data-size="sm" data-color="green"></div>
  <p>touch anywhere in this box</p>
</div>` },
    { title: 'Live: move a character', desc: 'Stick + action buttons, as they would sit in a game HUD.',
      html: `<div class="row" style="width:100%; justify-content:space-between">
  <div class="sc-joystick" id="liveStick" data-color="sky"></div>
  <div class="sc-actions" id="liveActs" data-layout="cluster">
    <button class="sc-action" data-value="dash" data-icon="energy" data-color="yellow" data-size="sm">Dash</button>
    <button class="sc-action" data-value="jump" data-icon="star" data-color="green" data-size="lg">Jump</button>
  </div>
</div>
<p class="log" id="liveLog">drag the stick, or use WASD / arrow keys</p>`,
      setup(p) {
        const log = p.querySelector('#liveLog');
        p.querySelector('#liveStick').addEventListener('move', e => log.textContent = `moving ${e.detail.dir} · power ${e.detail.distance}`);
        p.querySelector('#liveStick').addEventListener('end', () => log.textContent = 'stopped');
        p.querySelector('#liveActs').addEventListener('press', e => log.textContent = e.detail.value + ' pressed');
        p.querySelector('#liveActs').addEventListener('release', e => log.textContent = e.detail.value + ' released');
      } },
  ],
  api: [
    ['data-variant', 'stick dpad', 'stick', 'Thumbstick or 4-way pad.'],
    ['data-mode', 'fixed follow', 'fixed', 'follow: appears where the thumb lands inside a .sc-joystick-zone parent.'],
    ['data-snap', 'free 8 4', 'free', 'Directions the game receives.'],
    ['data-size', 'sm md lg', 'md', '120 / 150 / 180 px.'],
    ['data-color', 'sky blue green yellow orange red purple pink mint', 'sky', 'Knob / pad color.'],
    ['data-keys', 'false', '', 'Turn off WASD + arrow key control.'],
  ],
  js: `stick.addEventListener('move', e => {
  // e.detail = { x, y, angle, distance, dir }   x,y: -1…1 (y+ is down)
  player.move(e.detail.x, e.detail.y);
});
stick.addEventListener('end', () => player.stop());
SC.joystick.get('stick');   // { x, y, angle, distance, dir, active }`,
  rules: [
    'One joystick per game, bottom-left, with <b>Action Buttons bottom-right</b>. Put both in <code class="inline">.sc-screen-bottom</code> of the HUD screen.',
    '<b>Free</b> for smooth movement (runners, shooters), <b>8</b> for grid-ish movement, <b>4 / dpad</b> for classic retro movement.',
    '<b>follow mode</b> for full-screen games (the player never looks down); <b>fixed</b> when the control must stay in one place.',
    'Read <code class="inline">distance</code> for speed (0 = centre, 1 = full push). Always handle <code class="inline">end</code> to stop the player.',
    'Keep the HUD light: joystick + 1–3 action buttons is enough on a phone.',
  ],
});
</script>
</body>
</html>
