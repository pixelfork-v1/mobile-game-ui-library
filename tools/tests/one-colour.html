<!doctype html><meta charset="utf-8"><title>one colour per button</title>
<pre id="out">running…</pre>
<script>
// For every style, render buttons / icon buttons of every colour holding a WHITE glyph, then compare the label's
// colour with the glyph's rendered colour (sampled on a canvas after the CSS filter). They must match: both light or both dark.
const STYLES = ['super-casual','tactical-dark','fantasy-rpg-casual','pixel-retro','clean-flat'];
const COLORS = ['sky','blue','green','yellow','orange','red','purple','pink','dark','white','mint','cyan','olive'];
const lum = ([r,g,b]) => (0.2126*r + 0.7152*g + 0.0722*b) / 255;
async function run(style) {
  const f = document.createElement('iframe'); f.style.cssText = 'width:900px;height:600px'; document.body.append(f);
  const d = f.contentDocument; d.open();
  d.write(`<link rel=stylesheet href="../../../${style}/kit/core.css"><link rel=stylesheet href="../../../${style}/kit/components/button/button.css"><link rel=stylesheet href="../../../${style}/kit/components/icon-button/icon-button.css"><link rel=stylesheet href="../../../${style}/kit/assets/offsets.css"><script src="../../../${style}/kit/sc.js" data-assets="../../../${style}/kit/assets/"><\/script><body style="background:#888">` +
    COLORS.map(c => `<button class="sc-button" data-color="${c}" data-icon="restart">Retry</button>`).join('') + '</body>');
  d.close(); await new Promise(r => setTimeout(r, 2500));
  const bad = [];
  for (const b of d.querySelectorAll('.sc-button')) {
    const img = b.querySelector('img'), txt = b.querySelector('.sc-text'); if (!img || !txt) { bad.push(b.dataset.color + ': no img/text'); continue; }
    const label = lum(getComputedStyle(txt).color.match(/[\d.]+/g).slice(0, 3).map(Number).map((v, i, a) => a.length && v <= 1 && getComputedStyle(txt).color.startsWith('color(') ? v * 255 : v));
    const c = document.createElement('canvas'); c.width = c.height = 40; const x = c.getContext('2d');
    x.filter = f.contentWindow.getComputedStyle(img).filter.replace('none', '') || 'none'; x.drawImage(img, 0, 0, 40, 40);
    const px = x.getImageData(0, 0, 40, 40).data; let s = 0, n = 0;
    for (let i = 0; i < px.length; i += 4) if (px[i+3] > 200) { s += lum([px[i], px[i+1], px[i+2]]); n++; }
    const glyph = s / Math.max(n, 1);
    if ((label > .5) !== (glyph > .5)) bad.push(`${b.dataset.color}: label ${label.toFixed(2)} vs icon ${glyph.toFixed(2)}`);
  }
  f.remove(); return `${style}: ${bad.length ? 'MISMATCH ' + bad.join(' · ') : 'ok — icon and text match on all ' + COLORS.length + ' colours'}`;
}
(async () => { const lines = []; for (const s of STYLES) lines.push(await run(s)); out.textContent = lines.join('\n'); document.title = lines.some(l => l.includes('MISMATCH')) ? 'FAIL' : 'PASS'; })();
</script>
